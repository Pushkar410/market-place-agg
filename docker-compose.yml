# ---------------------------------------------------------------------------
# Local DEVELOPMENT infrastructure only (Postgres + Redis + Kafka).
# Run the backend and frontend yourself:   ./mvnw spring-boot:run   and   npm run dev
#
#   docker compose up -d            # start
#   docker compose down             # stop (data kept)
#   docker compose down -v          # stop and wipe all data
#
# To run EVERYTHING in containers (backend + frontend too) use docker-compose.full.yml.
# ---------------------------------------------------------------------------
services:
  postgres:
    image: postgres:15-alpine
    container_name: secondhand_postgres_dev
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: secondhand
    ports:
      - "5433:5432"   # host 5433 -> container 5432 (avoids clashing with a locally installed Postgres)
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d secondhand"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: secondhand_redis_dev
    ports:
      - "6379:6379"
    volumes:
      - redisdata_dev:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.7.0
    container_name: secondhand_kafka_dev
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafkadata_dev:/var/lib/kafka/data
    restart: unless-stopped

volumes:
  pgdata_dev:
  redisdata_dev:
  kafkadata_dev:
