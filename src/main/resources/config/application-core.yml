# Spring, veri kaynağı, güvenlik, dış servisler. Sırlar yalnızca ortam değişkenleriyle (aşağıdaki ${...}).
spring:
  cache:
    type: redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: true
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:secondhand-group}
      auto-offset-reset: earliest
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "*"
        spring.json.use.type.headers: true
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jackson:
    date-format: dd/MM/yyyy HH:mm
    time-zone: GMT+3
    locale: tr_TR
    serialization:
      fail-on-empty-beans: false
  jpa:
    properties:
      hibernate:
        enable_lazy_load_no_trans: true
        default_batch_fetch_size: 20
        jdbc.batch_size: 20
        order_inserts: true
        order_updates: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:not-configured}
            client-secret: ${GOOGLE_CLIENT_SECRET:not-configured}
            scope: ${GOOGLE_SCOPE:email,profile}
            redirect-uri: ${REDIRECT_URI:http://localhost:8080/login/oauth2/code/google}
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080

jwt:
  # Öncelik: JWT_SECRET_KEY; yoksa eski jwt_secretKey (migration)
  secretKey: ${JWT_SECRET_KEY:${jwt_secretKey:}}
  accessToken:
    expiration: 900000
  refreshToken:
    expiration: 604800000
    rememberMeExpiration: 2592000000

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

exchange:
  api:
    key: ${EXCHANGE_API_KEY:${exchangeApiKey:}}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:${cloudinaryCloudName:}}
  api-key: ${CLOUDINARY_API_KEY:${cloudinaryApiKey:}}
  api-secret: ${CLOUDINARY_API_SECRET:${cloudinarySecretKey:}}

gemini:
  api:
    key: ${GEMINI_API_KEY}
    model: ${GEMINI_API_MODEL:gemini-3.1-flash-lite}
    base-url: ${GEMINI_API_BASE_URL}
    fallback-memory-model: ${GEMINI_API_FALLBACK_MEMORY_MODEL:gemini-3.1-flash-lite}

aura:
  agent:
    search:
      enabled: ${AURA_AGENT_SEARCH_ENABLED:true}
      rate-limit-per-minute: ${AURA_AGENT_SEARCH_PER_MINUTE:12}
      rate-limit-window-ms: ${AURA_AGENT_SEARCH_WINDOW_MS:60000}

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  api:
    conventions:
      fail-fast: true
  e-wallet:
    default-balance: 10000.00
    spending-warning-threshold: 0.90
  membership:
    premium-price: ${PREMIUM_PRICE:100.00}
    premium-duration-days: ${PREMIUM_DURATION_DAYS:30}
